<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>داشبورد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="page-title">داشبورد</h1>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3-3"></path>
        </svg>
        <input id="globalSearch" type="search" placeholder="جستجوی سریع؛ سند، فاکتور، مشتری، حساب، کالا..." autocomplete="off" />
        <span class="kbd">Ctrl + K</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnTheme" type="button" title="حالت نمایش" aria-label="تغییر حالت روشن و تیره"></button>
        <button class="icon-btn" id="btnCalendar" type="button" title="تقویم" aria-label="تقویم">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 3v4M16 3v4"></path></svg>
        </button>
        <button class="icon-btn" id="btnNotify" type="button" title="اعلان‌ها" aria-label="اعلان‌ها">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg>
          <span class="dot" id="notifyDot" hidden></span>
        </button>
        <div style="position:relative">
          <button class="profile" id="btnProfile" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" id="avatar">م</span>
            <span class="profile-meta">
              <strong id="userName">کاربر</strong>
              <span id="userRole">مدیر سیستم</span>
            </span>
          </button>
          <div class="menu" id="profileMenu" role="menu">
            <button type="button" data-action="profile">حساب کاربری</button>
            <button type="button" data-action="settings">تنظیمات</button>
            <button type="button" data-action="logout">خروج</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <section class="welcome" aria-label="خوش‌آمد">
        <div class="welcome-copy">
          <h2 id="hello">سلام</h2>
          <p id="bannerHint">خلاصه وضعیت مالی امروز</p>
        </div>
        <div class="welcome-stats">
          <div><span>تاریخ</span><strong id="welcomeDate">—</strong></div>
          <div><span>وضعیت سیستم</span><strong id="systemStatus">آماده</strong></div>
          <div><span>آخرین ورود</span><strong id="lastLogin">—</strong></div>
        </div>
      </section>

      <section class="quick-bar" aria-label="دسترسی سریع">
        <div class="quick-bar-head">
          <h2 class="section-title">دسترسی سریع</h2>
          <button class="link-btn" type="button" data-action="shortcuts">تنظیم میانبرها</button>
        </div>
        <div class="quick-hero" id="quickActions"></div>
      </section>

      <section class="kpi-grid" id="kpiGrid" aria-label="شاخص‌های مالی"></section>

      <section class="charts-row">
        <article class="card chart-card">
          <div class="chart-head">
            <div>
              <h2 class="section-title">درآمد و هزینه</h2>
              <div class="legend" style="margin-top:4px"><span><i style="background:#059669"></i>درآمد</span><span><i style="background:#EA580C"></i>هزینه</span></div>
            </div>
            <div class="segmented" id="periods">
              <button type="button" data-period="1">امروز</button>
              <button type="button" data-period="7">هفته</button>
              <button type="button" data-period="1m">ماه</button>
              <button type="button" data-period="3">۳ ماه</button>
              <button type="button" data-period="6">۶ ماه</button>
              <button type="button" data-period="12" aria-pressed="true">۱۲ ماه</button>
            </div>
          </div>
          <div class="chart-box" id="lineChart"></div>
        </article>
        <article class="card chart-card">
          <h2 class="card-title">جریان نقدی</h2>
          <div class="chart-box" id="barChart"></div>
        </article>
      </section>

      <section class="ops-row">
        <article class="card table-card">
          <div class="table-head">
            <h2 class="section-title">آخرین اسناد</h2>
            <button class="link-btn" type="button" data-action="ledger">مشاهده همه</button>
          </div>
          <div class="table-wrap" id="docs"></div>
        </article>
        <article class="card alerts">
          <h2 class="section-title">هشدارها</h2>
          <div id="alerts"></div>
        </article>
        <article class="card activity-card">
          <h2 class="section-title">فعالیت‌های اخیر</h2>
          <div id="activities"></div>
        </article>
      </section>

      <footer class="footer">
        <span id="footerLeft">نسخه ۱.۰.۰ · تمامی حقوق محفوظ است.</span>
        <span id="footerRight">وضعیت اتصال: آنلاین</span>
      </footer>
    </main>
  </div>

  <div class="overlay" id="searchOverlay" hidden>
    <div class="search-modal" role="dialog" aria-label="جستجوی سراسری">
      <input id="commandInput" type="search" placeholder="جستجو در حساب‌ها، اسناد، فاکتورها، مشتریان و صفحات..." />
      <div id="commandResults"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="dashboard.js"></script>
</body>
</html>
